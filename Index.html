<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyberpunk Sling Puck - Final Edition</title>
  <style>
    body { margin: 0; background: #080810; color: #00f3ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    #canvas-container { position: relative; margin-top: 10px; border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff; width: 360px; height: 640px; }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-panel { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 4px; pointer-events: none; font-weight: bold; z-index: 5; }
    
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 8, 16, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    .overlay h1 { font-size: 28px; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin: 10px 0; text-align: center; }
    .overlay p { font-size: 16px; color: #00f3ff; margin-bottom: 20px; text-align: center; }
    .hidden { display: none !important; }

    .menu { margin-top: 10px; background: #121224; padding: 10px; border: 1px solid #ff0055; width: 340px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
    label { font-size: 12px; }
    button { background: #ff0055; color: white; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; }
    button:hover { background: #00f3ff; color: black; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="canvas-container">
    <div class="ui-panel">
      <div>P2: <span id="p2-count">0</span></div>
      <div>TIME: <span id="timer-display">--</span></div>
      <div>P1: <span id="p1-count">0</span></div>
    </div>

    <div id="game-overlay" class="overlay">
      <h1 id="overlay-title">CYBERPUNK SLING</h1>
      <p id="overlay-desc">載入底圖完成，點擊下方開始對戰</p>
      <button id="start-btn" onclick="startCountdown()">開始遊戲</button>
    </div>

    <canvas id="gameCanvas" width="360" height="640"></canvas>
  </div>

  <div class="menu">
    <div>
      <label>模式:</label>
      <select id="mode-select">
        <option value="pvp">雙人同屏 (PvP)</option>
        <option value="ai">單人對戰 (VS AI)</option>
      </select>
    </div>
    <div>
      <label>勝負:</label>
      <select id="win-select">
        <option value="clear">清空制 (Clear)</option>
        <option value="time">60秒計時 (Time)</option>
      </select>
    </div>
    <div>
      <label>棋子數:</label>
      <input type="number" id="puck-num" value="5" min="3" max="8" style="width: 40px;">
    </div>
    <div>
      <label>音效/震動:</label>
      <input type="checkbox" id="audio-toggle" checked>
    </div>
    <button onclick="resetGame()">重新開始</button>
  </div>

  <script>
    const { Engine, Composite, Bodies, Vector, Body, Runner, Events } = Matter;

    const engine = Engine.create({ gravity: { x: 0, y: 0 } });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 載入正式背景底圖 (請確保圖片檔名與此處一致並放在同目錄下)
    const bgImage = new Image();
    bgImage.src = 'watermarked_img_8437959961356028994.png';
    let bgReady = false;
    bgImage.onload = () => { bgReady = true; };

    let pucks = [];
    let selectedPuck = null;
    let dragStart = null;
    let isAI = false;
    let gameState = 'MENU';
    let timer = 60;
    let timerInterval = null;

    // Web Audio 合成音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, duration) {
      if (!document.getElementById('audio-toggle').checked) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // 建立碰撞牆面
    function setupWalls() {
      Composite.clear(engine.world);
      pucks = [];
      const wallOpts = { isStatic: true };
      
      const topWall = Bodies.rectangle(180, 50, 360, 20, wallOpts);
      const botWall = Bodies.rectangle(180, 590, 360, 20, wallOpts);
      const leftWall = Bodies.rectangle(15, 320, 20, 520, wallOpts);
      const rightWall = Bodies.rectangle(345, 320, 20, 520, wallOpts);
      const centerLeft = Bodies.rectangle(95, 320, 130, 26.6, wallOpts);
      const centerRight = Bodies.rectangle(265, 320, 130, 26.6, wallOpts);

      Composite.add(engine.world, [topWall, botWall, leftWall, rightWall, centerLeft, centerRight]);
    }

    Events.on(engine, 'collisionStart', () => {
      if (gameState === 'PLAYING') playSfx(300, 0.05);
    });

    function spawnPucks(count) {
      for (let i = 0; i < count; i++) {
        const p1 = Bodies.circle(80 + i * 40, 500, 14, { restitution: 0.8, frictionAir: 0.03 });
        const p2 = Bodies.circle(80 + i * 40, 140, 14, { restitution: 0.8, frictionAir: 0.03 });
        pucks.push(p1, p2);
      }
      Composite.add(engine.world, pucks);
    }

    function resetGame() {
      clearInterval(timerInterval);
      gameState = 'MENU';
      const count = parseInt(document.getElementById('puck-num').value);
      isAI = document.getElementById('mode-select').value === 'ai';
      
      setupWalls();
      spawnPucks(count);
      updateCount();

      document.getElementById('game-overlay').classList.remove('hidden');
      document.getElementById('overlay-title').innerText = 'CYBERPUNK SLING';
      document.getElementById('overlay-desc').innerText = '底圖加載完成，準備對戰';
      document.getElementById('start-btn').innerText = '開始遊戲';
      document.getElementById('timer-display').innerText = '--';
    }

    function startCountdown() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      gameState = 'COUNTDOWN';
      let count = 3;
      const title = document.getElementById('overlay-title');
      const desc = document.getElementById('overlay-desc');
      document.getElementById('start-btn').classList.add('hidden');
      
      desc.innerText = 'GET READY...';
      title.innerText = count;
      playSfx(440, 0.1);

      const cdInterval = setInterval(() => {
        count--;
        if (count > 0) {
          title.innerText = count;
          playSfx(440, 0.1);
        } else {
          clearInterval(cdInterval);
          playSfx(880, 0.2);
          document.getElementById('game-overlay').classList.add('hidden');
          document.getElementById('start-btn').classList.remove('hidden');
          startGameplay();
        }
      }, 1000);
    }

    function startGameplay() {
      gameState = 'PLAYING';
      const winMode = document.getElementById('win-select').value;

      if (winMode === 'time') {
        timer = 60;
        document.getElementById('timer-display').innerText = timer;
        timerInterval = setInterval(() => {
          if (gameState !== 'PLAYING') return;
          timer--;
          document.getElementById('timer-display').innerText = timer;
          if (timer <= 0) checkWinCondition(true);
        }, 1000);
      }
    }

    function checkWinCondition(isTimeUp = false) {
      if (gameState !== 'PLAYING') return;

      let p1Count = 0, p2Count = 0;
      pucks.forEach(p => {
        if (p.position.y > 320) p1Count++;
        else p2Count++;
      });

      const winMode = document.getElementById('win-select').value;
      let winner = null;

      if (winMode === 'clear') {
        if (p1Count === 0) winner = 'P1 (Player 1)';
        else if (p2Count === 0) winner = 'P2 (Player 2 / AI)';
      } else if (winMode === 'time' && isTimeUp) {
        if (p1Count < p2Count) winner = 'P1 (Player 1)';
        else if (p2Count < p1Count) winner = 'P2 (Player 2 / AI)';
        else winner = 'DRAW (平手)';
      }

      if (winner) triggerGameOver(winner);
    }

    function triggerGameOver(winner) {
      gameState = 'GAMEOVER';
      clearInterval(timerInterval);
      playSfx(600, 0.3);

      const overlay = document.getElementById('game-overlay');
      overlay.classList.remove('hidden');
      document.getElementById('overlay-title').innerText = 'GAME OVER';
      document.getElementById('overlay-desc').innerText = winner === 'DRAW (平手)' ? '雙方平手！' : `獲勝者: ${winner}`;
      document.getElementById('start-btn').innerText = '再玩一次';
    }

    canvas.addEventListener('mousedown', (e) => {
      if (gameState !== 'PLAYING') return;
      const rect = canvas.getBoundingClientRect();
      const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      
      pucks.forEach(puck => {
        if (Vector.magnitude(Vector.sub(puck.position, pos)) < 20) {
          selectedPuck = puck;
          dragStart = pos;
        }
      });
    });

    canvas.addEventListener('mousemove', (e) => {
      if (selectedPuck) {
        const rect = canvas.getBoundingClientRect();
        dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (selectedPuck && dragStart) {
        const force = Vector.mult(Vector.sub(selectedPuck.position, dragStart), 0.005);
        Body.applyForce(selectedPuck, selectedPuck.position, force);
        playSfx(520, 0.15);
        if (document.getElementById('audio-toggle').checked && navigator.vibrate) navigator.vibrate(30);
      }
      selectedPuck = null;
      dragStart = null;
    });

    function updateCount() {
      let p1Count = 0, p2Count = 0;
      pucks.forEach(p => {
        if (p.position.y > 320) p1Count++;
        else p2Count++;
      });
      document.getElementById('p1-count').innerText = p1Count;
      document.getElementById('p2-count').innerText = p2Count;
    }

    function runAI() {
      if (!isAI || gameState !== 'PLAYING') return;
      const p2Pucks = pucks.filter(p => p.position.y < 320 && Vector.magnitude(p.velocity) < 0.1);
      if (p2Pucks.length > 0 && Math.random() < 0.03) {
        const targetPuck = p2Pucks[Math.floor(Math.random() * p2Pucks.length)];
        const targetGate = { x: 180, y: 320 };
        const dir = Vector.normalise(Vector.sub(targetGate, targetPuck.position));
        Body.applyForce(targetPuck, targetPuck.position, Vector.mult(dir, 0.08));
        playSfx(480, 0.1);
      }
    }

    const runner = Runner.create();
    Runner.run(runner, engine);

    (function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgReady) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#080810';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      const bodies = Composite.allBodies(engine.world);
      bodies.forEach(b => {
        if (b.circleRadius) {
          ctx.beginPath();
          ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, 2 * Math.PI);
          ctx.fillStyle = b.position.y > 320 ? '#00f3ff' : '#ff0055';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        }
      });

      if (selectedPuck && dragStart && gameState === 'PLAYING') {
        ctx.beginPath();
        ctx.moveTo(selectedPuck.position.x, selectedPuck.position.y);
        ctx.lineTo(dragStart.x, dragStart.y);
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      runAI();
      updateCount();
      checkWinCondition();
      requestAnimationFrame(render);
    })();

    resetGame();
  </script>
</body>
</html>
